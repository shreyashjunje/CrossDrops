# CI for CrossDrop.
#
# - Every push and pull request: flutter analyze + flutter test (Linux, cheap).
# - Run manually (Actions > Build > Run workflow, or
#   `gh workflow run build.yml`): also builds the Android APK and an
#   unsigned iPhone .ipa. Run this after each phase, then install the
#   builds on the phones for the device checks in docs/DEVICE_TESTS.md.
#
# With the "bench" input on, both builds are benchmark builds
# (--dart-define=CROSSDROP_BENCH=true, D-058): release mode with Settings >
# Benchmark. Their files are named *-bench*. Never hand them to users.
#
# The iPhone build is unsigned. Install it from Windows with Sideloadly and
# a free Apple ID (DEVICE_TESTS.md, "Installing the CI builds"). macOS
# minutes count 10x on private repositories, so it only runs on demand.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: Benchmark build (Settings > Benchmark; test phones only)
        type: boolean
        default: false

# Least privilege: the jobs only read the repo and upload artifacts (audit S10).
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9
  BENCH_DEFINE: ${{ inputs.bench && '--dart-define=CROSSDROP_BENCH=true' || '' }}
  BENCH_SUFFIX: ${{ inputs.bench && '-bench' || '' }}

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Release signing (D-063, docs/RELEASE.md): with the repository
      # secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD the APK is signed with
      # the release key. Without them it is a test build signed with this
      # runner's debug key, named *-debugsigned; it installs, but cannot
      # update or be updated by any other build.
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CROSSDROP_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING_SUFFIX=" >> "$GITHUB_ENV"
          else
            echo "::warning::No release key in the repository secrets: debug-signed test build."
            echo "CROSSDROP_ALLOW_DEBUG_SIGNING=true" >> "$GITHUB_ENV"
            echo "SIGNING_SUFFIX=-debugsigned" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --release $BENCH_DEFINE
        env:
          CROSSDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CROSSDROP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CROSSDROP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APK after the commit
        run: mv build/app/outputs/flutter-apk/app-release.apk "crossdrop-${GITHUB_SHA::7}${BENCH_SUFFIX}${SIGNING_SUFFIX}.apk"
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crossdrop-android-${{ github.sha }}${{ env.BENCH_SUFFIX }}
          path: crossdrop-*.apk
          retention-days: 14

  ios:
    name: iPhone unsigned IPA
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign $BENCH_DEFINE
      # An .ipa is a zip with Runner.app inside a Payload folder. Sideloadly
      # signs it with the user's Apple ID when installing.
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "crossdrop-${GITHUB_SHA::7}${BENCH_SUFFIX}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crossdrop-ios-unsigned-${{ github.sha }}${{ env.BENCH_SUFFIX }}
          path: crossdrop-*-unsigned.ipa
          retention-days: 14
